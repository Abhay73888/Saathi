<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  
  <!-- Shield outline -->
  <path d="M256 90 L380 140 C380 270 256 380 256 420 C256 380 132 270 132 140 Z" fill="none" stroke="#ffffff" stroke-width="20" stroke-linejoin="round" opacity="0.9" />
  
  <!-- Companionship Connection Symbol (Two entwined hearts/nodes) -->
  <circle cx="210" cy="240" r="45" fill="url(#accent)" />
  <circle cx="302" cy="240" r="45" fill="#ffffff" />
  <path d="M175 320 Q256 380 337 320" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
